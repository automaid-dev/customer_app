name: automaid_customer
description: Automaid — customer app for laundry pickup, wash, and delivery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.2.0

  # QR scanning (bag QR display / scan-to-claim)
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Photo capture (booking instructions, profile avatar)
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
